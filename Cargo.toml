[package]
name = "claude-timer-reset"
version = "1.2.6"
edition = "2021"
description = "Lightweight desktop app for Claude CLI session scheduling and auto-restart"

[dependencies]
eframe = "0.29"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tray-icon = "0.19"
image = "0.25"
raw-window-handle = "0.6"
ureq = "2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
